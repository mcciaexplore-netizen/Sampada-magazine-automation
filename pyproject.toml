[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sampada-magazine-automation"
version = "0.1.0"
description = "Sampada magazine-to-YouTube production automation system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "Pillow>=10",
    "qrcode[pil]>=8",
    "edge-tts>=7",
    "imageio-ffmpeg>=0.6",
    "pandas>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "google-api-python-client>=2.100",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
    "upstash-redis>=1.1",
    "qstash>=2.0"
]
# opencv-python-headless is deliberately NOT a project dependency: Vercel's Python
# runtime builds the deployed function from this file (not requirements.txt), and
# opencv alone pushed the bundle past the 500MB function size limit. It only backs
# the image-based QR-code fallback (detect_qr_pdf_pages degrades gracefully without
# it), so it lives in requirements-dev.txt for local/CLI use instead -- run
# `pip install -r requirements-dev.txt` for local development, not `pip install -e .`.

[tool.vercel]
entrypoint = "backend_api:app"

[tool.setuptools]
py-modules = ["backend_api", "main", "generate_captions", "google_drive", "magazine_app", "blob_store", "job_state"]
