<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="100%" height="100%" fill="none">
  <!-- MCCIA Official Vector Logo -->
  <defs>
    <style>
      .m-blue { fill: #0060aa; }
      .m-green { fill: #12a84a; }
      .reg-mark { fill: #0060aa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <g transform="translate(15, 12)">
    <!-- Letter 'm' (3 distinct columns with top slant) -->
    <!-- Column 1 -->
    <path class="m-blue" d="M 0 54 L 20 44 L 20 100 L 0 100 Z"/>
    <!-- Column 2 -->
    <path class="m-blue" d="M 27 54 L 47 44 L 47 100 L 27 100 Z"/>
    <!-- Column 3 -->
    <path class="m-blue" d="M 54 54 L 74 44 L 74 100 L 54 100 Z"/>

    <!-- Letter 'c' 1 -->
    <path class="m-blue" d="M 87 50 L 105 44 L 140 44 L 131 60 L 107 60 L 107 84 L 131 84 L 122 100 L 87 100 Z"/>

    <!-- Letter 'c' 2 -->
    <path class="m-blue" d="M 148 50 L 166 44 L 201 44 L 192 60 L 168 60 L 168 84 L 192 84 L 183 100 L 148 100 Z"/>

    <!-- Letter 'i' -->
    <path class="m-blue" d="M 210 44 L 230 44 L 230 100 L 210 100 Z"/>

    <!-- Letter 'a' (Green) -->
    <path class="m-green" d="M 242 44 L 305 44 L 305 100 L 285 100 L 285 90 C 280 97 272 101 262 101 C 248 101 242 91 242 80 L 242 44 Z
                             M 262 61 C 257 61 257 65 257 70 C 257 75 257 79 262 79 C 267 79 270 75 270 70 C 270 65 267 61 262 61 Z"/>
    <!-- 'a' outer right tail accent -->
    <path class="m-green" d="M 305 84 L 322 100 L 305 100 Z"/>

    <!-- Trademark symbol ® -->
    <text x="312" y="38" class="reg-mark">®</text>
  </g>
</svg>
